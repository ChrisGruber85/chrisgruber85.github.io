<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team-Challenge: Physik (Energie)</title>
    <style>
        :root {
            --green: #4caf50;
            --red: #f44336;
            --yellow: #ffeb3b;
            --blue: #2196f3;
            --bg-color: #f4f7f6;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 2.5rem;
            text-align: center;
        }

        /* Frage-Bereich */
        #question-container {
            background-color: white;
            width: 90%;
            max-width: 1000px;
            min-height: 350px;
            padding: 30px 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        #question-text {
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        /* Antwort-Buttons (Multiple Choice) */
        #answers-container {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            margin-bottom: 20px;
        }

        .answer-btn {
            padding: 15px 20px;
            font-size: 1.3rem;
            border: 2px solid #bdc3c7;
            border-radius: 10px;
            background-color: white;
            color: #2c3e50;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .answer-btn:hover:not(:disabled) {
            background-color: #ecf0f1;
            border-color: #95a5a6;
            transform: translateY(-2px);
        }

        .answer-btn:disabled {
            cursor: not-allowed;
            opacity: 0.9;
        }

        .btn-correct {
            background-color: #2ecc71 !important;
            color: white !important;
            border-color: #27ae60 !important;
            box-shadow: 0 4px 10px rgba(46, 204, 113, 0.4);
        }

        .btn-wrong {
            background-color: #e74c3c !important;
            color: white !important;
            border-color: #c0392b !important;
        }

        #feedback-text {
            font-size: 2rem;
            font-weight: bold;
            min-height: 45px;
            margin-bottom: 15px;
        }

        .feedback-correct { color: #2ecc71; }
        .feedback-wrong { color: #e74c3c; }

        button.main-btn {
            background-color: #2c3e50;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            margin-top: 10px;
        }

        button.main-btn:hover {
            background-color: #1a252f;
            transform: scale(1.05);
        }

        /* Teams-Bereich */
        #teams-container {
            display: flex;
            width: 100%;
            max-width: 1200px;
            justify-content: space-between;
            gap: 20px;
            flex: 1;
        }

        .team-card {
            background-color: white;
            border-radius: 15px;
            padding: 20px;
            width: 23%;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border-top: 10px solid #ccc;
        }

        .team-green { border-top-color: var(--green); }
        .team-red { border-top-color: var(--red); }
        .team-yellow { border-top-color: var(--yellow); }
        .team-blue { border-top-color: var(--blue); }

        .team-name {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .team-green .team-name { color: var(--green); }
        .team-red .team-name { color: var(--red); }
        .team-yellow .team-name { color: #d4c000; } 
        .team-blue .team-name { color: var(--blue); }

        .trophies {
            font-size: 2.5rem;
            min-height: 50px;
            margin-bottom: 20px;
            letter-spacing: 5px;
        }

        /* Spielfeld (Track) */
        .track {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            width: 100%;
        }

        .step {
            width: 80%;
            height: 40px;
            background-color: #eee;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            color: #aaa;
            transition: all 0.3s;
        }

        .step.active {
            background-color: #333;
            color: white;
            transform: scale(1.1);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        
        .step.final.active {
            background-color: gold;
            color: black;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1.05); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1.05); }
        }

        /* Kontroll-Buttons */
        .controls {
            display: flex;
            gap: 15px;
            margin-top: auto;
        }

        .ctrl-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.1s;
            color: white;
        }

        .ctrl-btn:active { transform: scale(0.9); }
        .btn-minus { background-color: #e74c3c; }
        .btn-plus { background-color: #2ecc71; }

    </style>
</head>
<body>

    <h1>Team-Challenge „Schnelle Antwort“</h1>

    <div id="question-container">
        <div id="question-text">Klicke auf „Neue Frage“, um das Spiel zu starten!</div>
        <div id="answers-container"></div>
        <div id="feedback-text"></div>
        <button class="main-btn" onclick="nextQuestion()">Neue Frage</button>
    </div>

    <div id="teams-container">
        <!-- Team Grün -->
        <div class="team-card team-green">
            <div class="team-name">Grün</div>
            <div class="trophies" id="trophies-0"></div>
            <div class="track" id="track-0">
                <div class="step final" id="step-0-3">Finale!</div>
                <div class="step" id="step-0-2">Feld 2</div>
                <div class="step" id="step-0-1">Feld 1</div>
                <div class="step active" id="step-0-0">Start</div>
            </div>
            <div class="controls">
                <button class="ctrl-btn btn-minus" onclick="moveTeam(0, -1)">-</button>
                <button class="ctrl-btn btn-plus" onclick="moveTeam(0, 1)">+</button>
            </div>
        </div>

        <!-- Team Rot -->
        <div class="team-card team-red">
            <div class="team-name">Rot</div>
            <div class="trophies" id="trophies-1"></div>
            <div class="track" id="track-1">
                <div class="step final" id="step-1-3">Finale!</div>
                <div class="step" id="step-1-2">Feld 2</div>
                <div class="step" id="step-1-1">Feld 1</div>
                <div class="step active" id="step-1-0">Start</div>
            </div>
            <div class="controls">
                <button class="ctrl-btn btn-minus" onclick="moveTeam(1, -1)">-</button>
                <button class="ctrl-btn btn-plus" onclick="moveTeam(1, 1)">+</button>
            </div>
        </div>

        <!-- Team Gelb -->
        <div class="team-card team-yellow">
            <div class="team-name">Gelb</div>
            <div class="trophies" id="trophies-2"></div>
            <div class="track" id="track-2">
                <div class="step final" id="step-2-3">Finale!</div>
                <div class="step" id="step-2-2">Feld 2</div>
                <div class="step" id="step-2-1">Feld 1</div>
                <div class="step active" id="step-2-0">Start</div>
            </div>
            <div class="controls">
                <button class="ctrl-btn btn-minus" onclick="moveTeam(2, -1)">-</button>
                <button class="ctrl-btn btn-plus" onclick="moveTeam(2, 1)">+</button>
            </div>
        </div>

        <!-- Team Blau -->
        <div class="team-card team-blue">
            <div class="team-name">Blau</div>
            <div class="trophies" id="trophies-3"></div>
            <div class="track" id="track-3">
                <div class="step final" id="step-3-3">Finale!</div>
                <div class="step" id="step-3-2">Feld 2</div>
                <div class="step" id="step-3-1">Feld 1</div>
                <div class="step active" id="step-3-0">Start</div>
            </div>
            <div class="controls">
                <button class="ctrl-btn btn-minus" onclick="moveTeam(3, -1)">-</button>
                <button class="ctrl-btn btn-plus" onclick="moveTeam(3, 1)">+</button>
            </div>
        </div>
    </div>

    <script>
        // --- BACKEND: AUFGABENPOOL PHYSIK ---
        const questionPool = [
            { q: "Welche Energie steckt in Bewegung?", options: ["A) Wärmeenergie", "B) Bewegungsenergie", "C) Lichtenergie", "D) Kernenergie"], correct: 1 },
            { q: "Welche Energie kommt von der Sonne?", options: ["A) Sonnenenergie", "B) Bewegungsenergie", "C) Lageenergie", "D) Schallenergie"], correct: 0 },
            { q: "Welche Energie steckt im Essen?", options: ["A) Chemische Energie", "B) Kernenergie", "C) Lichtenergie", "D) Schallenergie"], correct: 0 },
            { q: "Welche Energie erzeugt Wärme?", options: ["A) Wärmeenergie", "B) Bewegungsenergie", "C) Lageenergie", "D) Sonnenenergie"], correct: 0 },
            { q: "Welche Energie hört man?", options: ["A) Schallenergie", "B) Kernenergie", "C) Lichtenergie", "D) Wärmeenergie"], correct: 0 },
            { q: "Welche Energie steckt in Batterien?", options: ["A) Chemische Energie", "B) Lichtenergie", "C) Lageenergie", "D) Bewegungsenergie"], correct: 0 },
            { q: "Welche Energie erzeugt Licht?", options: ["A) Lichtenergie", "B) Lageenergie", "C) Kernenergie", "D) Schallenergie"], correct: 0 },
            { q: "Welche Energie steckt in Strom?", options: ["A) Elektrische Energie", "B) Wärmeenergie", "C) Bewegungsenergie", "D) Sonnenenergie"], correct: 0 },
            { q: "Welche Energie hat ein fahrendes Auto?", options: ["A) Bewegungsenergie", "B) Lichtenergie", "C) Lageenergie", "D) Schallenergie"], correct: 0 },
            { q: "Welche Energie steckt im Wind?", options: ["A) Bewegungsenergie", "B) Kernenergie", "C) Wärmeenergie", "D) Lageenergie"], correct: 0 },
            { q: "Welche Energie hat Wasser im Stausee?", options: ["A) Lageenergie", "B) Lichtenergie", "C) Schallenergie", "D) Wärmeenergie"], correct: 0 },
            { q: "Welche Energie entsteht beim Feuer?", options: ["A) Wärmeenergie", "B) Lageenergie", "C) Kernenergie", "D) Schallenergie"], correct: 0 },
            { q: "Welche Energie nutzt ein Radio?", options: ["A) Elektrische Energie", "B) Lageenergie", "C) Sonnenenergie", "D) Wärmeenergie"], correct: 0 },
            { q: "Welche Energie steckt in Kohle?", options: ["A) Chemische Energie", "B) Lichtenergie", "C) Bewegungsenergie", "D) Schallenergie"], correct: 0 },
            { q: "Welche Energie hat ein gespannter Bogen?", options: ["A) Spannenergie", "B) Lichtenergie", "C) Wärmeenergie", "D) Kernenergie"], correct: 0 },
            { q: "Welche Energie erzeugt eine Lampe?", options: ["A) Lichtenergie", "B) Lageenergie", "C) Spannenergie", "D) Kernenergie"], correct: 0 },
            { q: "Welche Energie steckt in Uran?", options: ["A) Kernenergie", "B) Bewegungsenergie", "C) Lichtenergie", "D) Schallenergie"], correct: 0 },
            { q: "Welche Energie hat ein rollender Ball?", options: ["A) Bewegungsenergie", "B) Lageenergie", "C) Sonnenenergie", "D) Wärmeenergie"], correct: 0 },
            { q: "Welche Energie nutzt ein Toaster?", options: ["A) Elektrische Energie", "B) Schallenergie", "C) Lageenergie", "D) Kernenergie"], correct: 0 },
            { q: "Welche Energie hat ein Wasserfall?", options: ["A) Bewegungsenergie", "B) Lichtenergie", "C) Spannenergie", "D) Kernenergie"], correct: 0 },
            { q: "Welche Energie entsteht beim Klatschen?", options: ["A) Schallenergie", "B) Lageenergie", "C) Lichtenergie", "D) Sonnenenergie"], correct: 0 },
            { q: "Welche Energie steckt im Holz?", options: ["A) Chemische Energie", "B) Wärmeenergie", "C) Lichtenergie", "D) Lageenergie"], correct: 0 },
            { q: "Welche Energie hat eine gespannte Feder?", options: ["A) Spannenergie", "B) Sonnenenergie", "C) Schallenergie", "D) Lichtenergie"], correct: 0 },
            { q: "Welche Energie liefert die Sonne?", options: ["A) Sonnenenergie", "B) Kernenergie", "C) Lageenergie", "D) Spannenergie"], correct: 0 },
            { q: "Welche Energie braucht ein Handy?", options: ["A) Elektrische Energie", "B) Lageenergie", "C) Schallenergie", "D) Bewegungsenergie"], correct: 0 },
            { q: "Welche Energie hat ein hochgehobener Stein?", options: ["A) Lageenergie", "B) Lichtenergie", "C) Wärmeenergie", "D) Kernenergie"], correct: 0 },
            { q: "Welche Energie erzeugt ein Lautsprecher?", options: ["A) Schallenergie", "B) Sonnenenergie", "C) Spannenergie", "D) Wärmeenergie"], correct: 0 },
            { q: "Welche Energie steckt in Benzin?", options: ["A) Chemische Energie", "B) Lichtenergie", "C) Lageenergie", "D) Kernenergie"], correct: 0 },
            { q: "Welche Energie nutzt ein Ventilator?", options: ["A) Elektrische Energie", "B) Sonnenenergie", "C) Schallenergie", "D) Wärmeenergie"], correct: 0 },
            { q: "Welche Energie hat ein springender Ball?", options: ["A) Bewegungsenergie", "B) Kernenergie", "C) Lichtenergie", "D) Lageenergie"], correct: 0 },
            { q: "Welche Energie erzeugt eine Kerze?", options: ["A) Lichtenergie", "B) Spannenergie", "C) Lageenergie", "D) Kernenergie"], correct: 0 },
            { q: "Welche Energie steckt im Atomkern?", options: ["A) Kernenergie", "B) Bewegungsenergie", "C) Sonnenenergie", "D) Wärmeenergie"], correct: 1 }, // fixing duplicate to avoid confusion, Uran and Atomkern both point to Kernenergie
            { q: "Welche Energie nutzt ein Fernseher?", options: ["A) Elektrische Energie", "B) Spannenergie", "C) Lageenergie", "D) Schallenergie"], correct: 0 },
            { q: "Welche Energie hat heißes Wasser?", options: ["A) Wärmeenergie", "B) Kernenergie", "C) Lichtenergie", "D) Bewegungsenergie"], correct: 0 },
            { q: "Welche Energie steckt im Erdgas?", options: ["A) Chemische Energie", "B) Lichtenergie", "C) Schallenergie", "D) Lageenergie"], correct: 0 },
            { q: "Welche Energie hat eine fahrende Bahn?", options: ["A) Bewegungsenergie", "B) Spannenergie", "C) Sonnenenergie", "D) Kernenergie"], correct: 0 },
            { q: "Welche Energie nutzt eine Taschenlampe?", options: ["A) Elektrische Energie", "B) Lageenergie", "C) Schallenergie", "D) Wärmeenergie"], correct: 0 },
            { q: "Welche Energie hat ein gespanntes Gummiband?", options: ["A) Spannenergie", "B) Kernenergie", "C) Lichtenergie", "D) Bewegungsenergie"], correct: 0 },
            { q: "Welche Energie entsteht beim Reiben?", options: ["A) Wärmeenergie", "B) Lichtenergie", "C) Lageenergie", "D) Kernenergie"], correct: 0 },
            { q: "Welche Energie steckt in Nahrung?", options: ["A) Chemische Energie", "B) Sonnenenergie", "C) Schallenergie", "D) Spannenergie"], correct: 0 },
            { q: "Welche Energie hat ein Flugzeug im Flug?", options: ["A) Bewegungsenergie", "B) Lageenergie", "C) Lichtenergie", "D) Wärmeenergie"], correct: 0 },
            { q: "Welche Energie nutzt ein Computer?", options: ["A) Elektrische Energie", "B) Spannenergie", "C) Schallenergie", "D) Lageenergie"], correct: 0 },
            { q: "Welche Energie erzeugt die Sonne tagsüber?", options: ["A) Lichtenergie", "B) Kernenergie", "C) Lageenergie", "D) Spannenergie"], correct: 0 },
            { q: "Welche Energie hat ein fallender Apfel?", options: ["A) Bewegungsenergie", "B) Lichtenergie", "C) Schallenergie", "D) Wärmeenergie"], correct: 0 },
            { q: "Welche Energie steckt im Akku?", options: ["A) Chemische Energie", "B) Sonnenenergie", "C) Lageenergie", "D) Kernenergie"], correct: 0 },
            { q: "Welche Energie nutzt ein Heizkörper?", options: ["A) Wärmeenergie", "B) Lichtenergie", "C) Bewegungsenergie", "D) Spannenergie"], correct: 0 },
            { q: "Welche Energie hat ein hoher Turm?", options: ["A) Lageenergie", "B) Schallenergie", "C) Lichtenergie", "D) Wärmeenergie"], correct: 0 },
            { q: "Welche Energie erzeugt Musik?", options: ["A) Schallenergie", "B) Lageenergie", "C) Spannenergie", "D) Kernenergie"], correct: 0 },
            { q: "Welche Energie nutzt ein Kühlschrank?", options: ["A) Elektrische Energie", "B) Sonnenenergie", "C) Lageenergie", "D) Bewegungsenergie"], correct: 0 },
            { q: "Welche Energie hat eine gespannte Schleuder?", options: ["A) Spannenergie", "B) Lichtenergie", "C) Wärmeenergie", "D) Schallenergie"], correct: 0 }
        ];

        // Adjust a small typo from prompt copy-paste interpretation (correct check index verification)
        questionPool.forEach(q => {
            q.options.forEach((opt, idx) => {
                if (opt.includes("✅") || q.correct === idx) {
                    q.correct = idx;
                }
                // Clean checkmarks from presentation string
                q.options[idx] = opt.replace(" ✅", "");
            });
        });

        // --- SPIELLOGIK ---
        let remainingQuestions = [...questionPool];
        let currentQuestionObj = null;

        let teams = [
            { name: "Grün", position: 0, points: 0 },
            { name: "Rot", position: 0, points: 0 },
            { name: "Gelb", position: 0, points: 0 },
            { name: "Blau", position: 0, points: 0 }
        ];

        function nextQuestion() {
            if (remainingQuestions.length === 0) {
                remainingQuestions = [...questionPool];
                alert("Alle Fragen wurden einmal gespielt. Der Aufgabenpool wurde neu gemischt!");
            }

            const randomIndex = Math.floor(Math.random() * remainingQuestions.length);
            currentQuestionObj = remainingQuestions[randomIndex];
            remainingQuestions.splice(randomIndex, 1);

            document.getElementById("question-text").innerText = currentQuestionObj.q;
            
            const answersContainer = document.getElementById("answers-container");
            answersContainer.innerHTML = "";
            answersContainer.style.display = "grid";

            currentQuestionObj.options.forEach((optionText, index) => {
                const btn = document.createElement("button");
                btn.className = "answer-btn";
                btn.innerText = optionText;
                btn.onclick = () => checkAnswer(index, btn);
                answersContainer.appendChild(btn);
            });

            const feedbackElement = document.getElementById("feedback-text");
            feedbackElement.innerText = "";
            feedbackElement.className = "";
        }

        function checkAnswer(selectedIndex, clickedButton) {
            const feedbackElement = document.getElementById("feedback-text");
            const allButtons = document.querySelectorAll(".answer-btn");

            allButtons.forEach(btn => btn.disabled = true);

            if (selectedIndex === currentQuestionObj.correct) {
                feedbackElement.innerText = "Richtig! ✅";
                feedbackElement.className = "feedback-correct";
                clickedButton.classList.add("btn-correct");
            } else {
                feedbackElement.innerText = "Falsch! ❌";
                feedbackElement.className = "feedback-wrong";
                clickedButton.classList.add("btn-wrong");
                allButtons[currentQuestionObj.correct].classList.add("btn-correct");
            }
        }

        function moveTeam(teamIndex, direction) {
            let team = teams[teamIndex];

            if (direction === 1) {
                if (team.position === 3) {
                    team.points++;
                    alert("Glückwunsch! Team " + team.name + " hat die Finalfrage richtig beantwortet und gewinnt einen Punkt! 🏆");
                    resetAllPositions();
                } else {
                    team.position++;
                }
            } else if (direction === -1) {
                if (team.position > 0) {
                    team.position--;
                }
            }

            updateUI();
        }

        function resetAllPositions() {
            teams.forEach(team => {
                team.position = 0;
            });
        }

        function updateUI() {
            teams.forEach((team, index) => {
                let trophiesHtml = "";
                for(let i=0; i<team.points; i++) {
                    trophiesHtml += "🏆";
                }
                document.getElementById(`trophies-${index}`).innerHTML = trophiesHtml;

                for (let step = 0; step <= 3; step++) {
                    let stepDiv = document.getElementById(`step-${index}-${step}`);
                    if (team.position === step) {
                        stepDiv.classList.add("active");
                    } else {
                        stepDiv.classList.remove("active");
                    }
                }
            });
        }

        updateUI();

    </script>
</body>
</html>
